<section
  class="avatar-card"
  [class.waiting-card]="!loading && !text"
  [class.loading-card]="loading"
>
  @if (loading) {
    <div class="loading-wrap">
      <div class="spinner"></div>
    </div>
  } @else {
    <div class="avatar-stage" [class.waiting-stage]="!text">
      <div class="stars-overlay"></div>
      <div class="portrait-frame" [class.waiting-frame]="!text">
        <div
          class="portrait-art"
          [class.face-speaking]="speaking"
          [class.waiting-art]="!text"
        >
          <div class="eye eye-left"></div>
          <div class="eye eye-right"></div>
          <div class="mouth" [class.mouth-speaking]="speaking"></div>
        </div>
      </div>
      @if (text) {
        <p class="speech-text">{{ text }}</p>
      }
    </div>
  }

  <!-- Khung livestream: luôn render, không phụ thuộc loading/kết quả. -->
  <div
    class="waiting-float"
    [attr.aria-hidden]="text ? 'true' : 'false'"
    [style.left.px]="floatLeft"
    [style.top.px]="floatTop"
    [style.width.px]="floatWidth"
    [style.height.px]="floatHeight"
    [class.waiting-hidden]="!!text"
  >
    <div class="waiting-float-drag" (pointerdown)="onDragStart($event)"></div>
    <video
      #waitingVideo
      class="waiting-video"
      loop
      muted
      playsinline
      preload="auto"
      [src]="waitingVideoSrc"
    ></video>
    <div class="waiting-float-resize" (pointerdown)="onResizeStart($event)"></div>
  </div>
</section>
